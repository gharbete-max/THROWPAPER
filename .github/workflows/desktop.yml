name: Desktop

# Loppa for Windows and macOS (docs/adr/0016-desktop-edition.md): the Windows installer and
# portable .exe, and the Mac disk images for Apple Silicon and Intel.
#
# Each is built on its own platform, because each needs that platform's tools (NSIS and rcedit;
# hdiutil and codesign); a cross-build elsewhere only produces a zip. Runs on pull requests that
# touch what goes into the app, by hand, and on a `desktop-v*` tag — which also publishes the files
# as a GitHub release, the "download" in "downloadable".

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/api-sign/**'
      - 'apps/sign/**'
      - 'apps/api-forms/src/desktop/**'
      - 'apps/api-forms/src/db/pglite.ts'
      - 'apps/api-forms/src/mail/**'
      - 'apps/api-forms/drizzle/**'
      - '.github/workflows/desktop.yml'
  # By hand. With `release` ticked, on main only: builds, then tags this commit
  # `desktop-v<apps/desktop version>` and publishes — the same release a pushed tag makes, for
  # whoever cannot push a tag. Refused if that tag already exists.
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release, tagged desktop-v<apps/desktop/package.json version>'
        type: boolean
        default: false
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    # Read off the built Loppa.exe, not off whether a secret was set — the release notes say what
    # this is.
    outputs:
      signed: ${{ steps.signature.outputs.signed }}
    steps:
      - uses: actions/checkout@v7
      # A `desktop-v1.2.3` tag must name the version the app is built as (apps/desktop/package.json):
      # otherwise the release would be titled 1.2.3 and carry files that report another version.
      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME#desktop-v}" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $v"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # PDFs render through the Edge every Windows has; Playwright's own browsers are not needed.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm --filter @tp/forms build
      # Sign runs beside Forms on the desktop; its signing page ships in the app.
      - run: pnpm --filter @tp/sign build
      # Code signing, the moment the owner adds a certificate (LAUNCH-CHECKLIST §6). electron-builder
      # signs when CSC_LINK is set; an empty secret must not set it, or it tries and fails. Not on a
      # pull request, where electron-builder skips signing anyway — as on the Mac below.
      - name: Signing certificate, if there is one
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          LINK: ${{ secrets.WIN_CSC_LINK }}
          PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$LINK" ]; then
            { echo "CSC_LINK=$LINK"; echo "CSC_KEY_PASSWORD=$PASSWORD"; } >> "$GITHUB_ENV"
            echo "Signing with the configured certificate."
          else
            echo "No certificate configured: the build is unsigned, and the release says so."
          fi
      - run: pnpm --filter @tp/desktop package:win

      # An installer that builds is not an app that starts. Launch the unpacked Loppa.exe against a
      # throwaway profile and wait for its local server to answer — the same /health the container
      # smoke test reads — then stop it.
      - name: Smoke-test Loppa.exe
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP 'loppa-profile'
          $app = Start-Process -FilePath 'apps/desktop/release/win-unpacked/Loppa.exe' `
            -ArgumentList "--user-data-dir=$profile" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:47017/health' -TimeoutSec 2
              # Loppa Sign starts first, beside Forms (ADR 0016); both must answer.
              $sign = Invoke-RestMethod -Uri 'http://127.0.0.1:47018/health' -TimeoutSec 2
              if ($health.status -eq 'ok' -and $sign.service -eq 'api-sign') { $ok = $true; break }
            } catch { }
            if ($app.HasExited) { break }
            Start-Sleep -Seconds 2
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse (Join-Path $profile 'workspace') | Select-Object FullName | Format-Table -HideTableHeaders
          if (-not $ok) { throw 'Loppa.exe did not answer on 127.0.0.1:47017 and :47018' }

      # With a certificate configured, every file shipped must carry a valid signature; without
      # one, none claims to. A certificate that was set and did not sign fails the build.
      - name: Signature
        id: signature
        shell: pwsh
        run: |
          $files = @('apps/desktop/release/win-unpacked/Loppa.exe') +
            (Get-ChildItem 'apps/desktop/release/Loppa-Setup-*.exe', 'apps/desktop/release/Loppa-*-portable.exe').FullName
          $valid = 0
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -FilePath $file
            "{0}: {1} {2}" -f (Split-Path $file -Leaf), $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -eq 'Valid') { $valid++ }
          }
          $expected = -not [string]::IsNullOrEmpty($env:CSC_LINK)
          if ($expected -and $valid -ne $files.Count) { throw 'A certificate is configured, but not every file is validly signed' }
          "signed=$(if ($valid -eq $files.Count) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: loppa-windows
          path: |
            apps/desktop/release/Loppa-Setup-*.exe
            apps/desktop/release/Loppa-*-portable.exe
          # A renamed file must fail here, not publish a release with a hole in it.
          if-no-files-found: error
          retention-days: 14

  macos:
    # Apple Silicon. The Intel image is built here too, by cross-arch packaging on the same host.
    runs-on: macos-latest
    outputs:
      signing: ${{ steps.signature.outputs.signing }}
    steps:
      - uses: actions/checkout@v7
      # A `desktop-v1.2.3` tag must name the version the app is built as (apps/desktop/package.json):
      # otherwise the release would be titled 1.2.3 and carry files that report another version.
      - name: Tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          v=$(node -p "require('./apps/desktop/package.json').version")
          if [ "${GITHUB_REF_NAME#desktop-v}" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $v"
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: pnpm --filter @tp/forms build
      # Sign runs beside Forms on the desktop; its signing page ships in the app.
      - run: pnpm --filter @tp/sign build
      # The owner's Developer ID and Apple's notarisation key (LAUNCH-CHECKLIST §6), when they
      # exist — src/packaging/signing.ts turns them into a signed, hardened, notarised app. Only on
      # a release: electron-builder skips signing on a pull request, and a skipped Developer ID
      # would leave the bundle unsigned, so pull requests keep proving the ad-hoc build instead.
      - name: Developer ID, if there is one
        if: github.event_name != 'pull_request'
        env:
          LINK: ${{ secrets.MAC_CSC_LINK }}
          PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          if [ -z "$LINK" ]; then
            echo "No Developer ID configured: the Mac build is ad-hoc signed, and the release says so."
            exit 0
          fi
          { echo "CSC_LINK=$LINK"; echo "CSC_KEY_PASSWORD=$PASSWORD"; } >> "$GITHUB_ENV"
          if [ -n "$API_KEY" ]; then
            # notarytool reads the App Store Connect key from a .p8 file; the secret is its text.
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$API_KEY" > "$key"
            chmod 600 "$key"
            { echo "APPLE_API_KEY=$key"; echo "APPLE_API_KEY_ID=$API_KEY_ID"; echo "APPLE_API_ISSUER=$API_ISSUER"; } >> "$GITHUB_ENV"
          fi
          echo "Signing with the configured Developer ID."
      - run: pnpm --filter @tp/desktop package:mac

      # What the app actually is, read off it: Developer ID and accepted by Gatekeeper (notarised),
      # Developer ID only, or ad-hoc. Configured and not achieved fails the build.
      - name: Signature
        id: signature
        run: |
          set -uo pipefail
          # Both architectures: mac-arm64/ and the Intel one beside it.
          for app in apps/desktop/release/mac*/Loppa.app; do
            codesign --verify --deep --strict --verbose=2 "$app" || exit 1
            codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Runtime|Signature)' || true
          done
          app=apps/desktop/release/mac-arm64/Loppa.app
          if codesign -dv "$app" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            if spctl --assess --type execute -vv "$app" && xcrun stapler validate "$app"; then
              signing=notarised
            else
              signing=developer-id
            fi
          else
            signing=ad-hoc
          fi
          echo "macOS signing: $signing"
          if [ -n "${CSC_LINK:-}" ] && [ "$signing" = ad-hoc ]; then
            echo "::error::a Developer ID is configured, but the app is ad-hoc signed"; exit 1
          fi
          if [ -n "${APPLE_API_KEY:-}" ] && [ "$signing" != notarised ]; then
            echo "::error::notarisation is configured, but Gatekeeper does not accept the app"; exit 1
          fi
          echo "signing=$signing" >> "$GITHUB_OUTPUT"

      # Same proof as Windows: the arm64 app starts and its local server answers. An Apple Silicon
      # Mac refuses an unsigned binary outright, and a hardened runtime missing an entitlement the
      # app needs crashes it, so this is also the signing check.
      - name: Smoke-test Loppa.app
        run: |
          profile="$RUNNER_TEMP/loppa-profile"
          app="apps/desktop/release/mac-arm64/Loppa.app/Contents/MacOS/Loppa"
          # Deep and strict: the fuses are flipped after the ad-hoc signature, and a shallow
          # check passed a bundle whose inner binary no longer matched it.
          codesign --verify --deep --strict --verbose=2 "apps/desktop/release/mac-arm64/Loppa.app"
          "$app" --user-data-dir="$profile" > "$RUNNER_TEMP/loppa.log" 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:47017/health | grep -q '"status":"ok"' &&
               curl -fsS http://127.0.0.1:47018/health | grep -q '"service":"api-sign"'; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          ls -R "$profile/workspace" | head -20 || true
          if [ "$ok" != 1 ]; then cat "$RUNNER_TEMP/loppa.log"; echo "Loppa.app did not answer on 127.0.0.1:47017 and :47018"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: loppa-macos
          path: apps/desktop/release/Loppa-*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: apps/desktop/package.json
          sparse-checkout-cone-mode: false
      # The tag this release is published under: the pushed one, or — run by hand — the one named
      # by the app's own version, created on this commit by `gh release create --target`.
      - name: Which tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "verify=--verify-tag" >> "$GITHUB_OUTPUT"
          else
            tag="desktop-v$(node -p "require('./apps/desktop/package.json').version")"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::$tag already exists; raise apps/desktop/package.json's version first"
              exit 1
            fi
            echo "name=$tag" >> "$GITHUB_OUTPUT"
            echo "verify=--target=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v7
        with:
          pattern: loppa-*
          merge-multiple: true
          path: dist
      # Stable names, so the README's links (releases/latest/download/<name>) keep working from one
      # release to the next; the version is the release's tag. Checksums beside them, so a download
      # can be checked against what this workflow built.
      - name: Stable names and checksums
        working-directory: dist
        run: |
          set -euo pipefail
          mv Loppa-Setup-*.exe Loppa-Windows-Setup.exe
          mv Loppa-*-portable.exe Loppa-Windows-Portable.exe
          mv Loppa-*-arm64.dmg Loppa-macOS-AppleSilicon.dmg
          mv Loppa-*-x64.dmg Loppa-macOS-Intel.dmg
          sha256sum Loppa-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      # The signing paragraph is what the build jobs read off the files they made: unsigned
      # (Windows) and ad-hoc, not notarised (macOS) until the owner's certificates exist
      # (LAUNCH-CHECKLIST §6) — the notes say so, because SmartScreen and Gatekeeper will.
      # Created as a draft with every file attached, then published — never a public release that
      # is still missing half its files.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          VERIFY: ${{ steps.tag.outputs.verify }}
          WINDOWS_SIGNED: ${{ needs.windows.outputs.signed }}
          MAC_SIGNING: ${{ needs.macos.outputs.signing }}
        run: |
          set -euo pipefail
          version="${TAG#desktop-v}"
          if [ "$WINDOWS_SIGNED" = true ]; then
            windows="The Windows files are code-signed."
          else
            windows="**The Windows files are not yet code-signed.** SmartScreen warns on first run: choose *More info → Run anyway*."
          fi
          case "$MAC_SIGNING" in
            notarised) mac="The Mac builds are signed with a Developer ID and notarised by Apple." ;;
            developer-id) mac="**The Mac builds are signed with a Developer ID but not notarised.** The first time, right-click Loppa and choose *Open*." ;;
            *) mac="**The Mac builds are ad-hoc signed and not notarised.** The first time, right-click Loppa and choose *Open*." ;;
          esac
          cat > notes.md <<NOTES
          Loppa desktop ${version} for Windows and macOS — forms, finished documents and email on one computer, offline.

          | Download | For |
          | --- | --- |
          | Loppa-Windows-Setup.exe | Windows 10 and 11 (x64), installs for your user |
          | Loppa-Windows-Portable.exe | Windows, runs without installing |
          | Loppa-macOS-AppleSilicon.dmg | Macs with an M-series chip |
          | Loppa-macOS-Intel.dmg | Macs with an Intel chip |

          ${windows} ${mac}

          Check a download: compare \`shasum -a 256 <file>\` (macOS) or \`Get-FileHash <file>\` (Windows) with SHA256SUMS.txt.

          Built from ${GITHUB_SHA} by the Desktop workflow. What works offline: docs/adr/0016-desktop-edition.md.
          NOTES
          gh release create "$TAG" \
            dist/Loppa-Windows-Setup.exe dist/Loppa-Windows-Portable.exe \
            dist/Loppa-macOS-AppleSilicon.dmg dist/Loppa-macOS-Intel.dmg dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" "$VERIFY" --draft \
            --title "Loppa desktop ${version}" --notes-file notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
