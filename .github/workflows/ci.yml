name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: throwpaper
          POSTGRES_PASSWORD: throwpaper
          POSTGRES_DB: throwpaper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U throwpaper" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://throwpaper:throwpaper@localhost:5432/throwpaper
      # Test value only. Real deployments generate their own; the server refuses to start without one.
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The phase 1 proof test renders a real PDF; phase 3 e2e will reuse this browser.
      - run: pnpm exec playwright install --with-deps chromium
      # Migrate before verify: the database smoke test needs the schema to exist, and this is
      # the order a real deployment uses. Seeding here also proves the seed matches the schema.
      - run: pnpm run db:migrate
      - run: pnpm run db:seed
      - run: pnpm run verify
      - run: pnpm run contract:check
      - run: pnpm run format:check
      # The only place the end-to-end suite can run: it needs the Postgres this job provides.
      - run: pnpm run test:e2e
        env:
          CI: 'true'
      # The Dockerfile is only ever proven by building it, and nobody here has Docker.
      - name: Build the deployment image
        run: docker build -t formwork:ci .

      # A container that boots and answers is the difference between "it compiled" and "it runs".
      - name: Smoke-test the image in demo mode
        run: |
          # Whatever happens, print the container's own account of it. The first version of this
          # step exited before reaching `docker logs`, so a crash-at-boot reported nothing but a
          # column of refused connections.
          trap 'echo "--- container logs ---"; docker logs formwork-demo 2>&1 || true; docker rm -f formwork-demo > /dev/null 2>&1 || true' EXIT

          docker run -d --name formwork-demo -p 4100:4001 -e DEMO=true formwork:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4100/health > /dev/null; then break; fi
            if [ -z "$(docker ps -q -f name=formwork-demo)" ]; then
              echo "The container exited before it ever answered."
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:4100/health | tee /dev/stderr | grep -q '"mode":"demo"'

          # The app itself must be served, not just the API.
          curl -fsS http://localhost:4100/ | grep -qi '<div id="root"'
          # And a client route must fall back to index.html rather than 404.
          curl -fsS http://localhost:4100/f/varmotet | grep -qi '<div id="root"'

          # The app is built to call /api/*, which only the Vite dev proxy used to strip. Without
          # the server doing it too, the container serves a page that renders and then fails every
          # request — which is worse than not starting, because it looks like it works.
          curl -fsS http://localhost:4100/api/health | grep -q '"mode":"demo"'
          curl -fsS http://localhost:4100/api/public/forms/varmotet | grep -q '"slug":"varmotet"'

          # A JavaScript bundle must come back as JavaScript. If the SPA fallback swallows it, the
          # browser refuses the module on MIME grounds and the page is blank.
          asset=$(curl -fsS http://localhost:4100/ | grep -o '/assets/[A-Za-z0-9_-]*.js' | head -1)
          echo "asset: $asset"
          curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:4100$asset" | grep -q javascript

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
