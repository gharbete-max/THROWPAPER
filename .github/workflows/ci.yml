name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # apps/desktop depends on Electron, whose install downloads a 100 MB browser. Nothing in this
  # workflow launches the desktop shell — `pnpm build` stages it, desktop.yml packages and runs it.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  # Secrets and vulnerable dependencies, before anything slower runs.
  #
  # Separate from `verify` on purpose: it needs no Postgres and no Chromium, so it answers in
  # under a minute and fails a pull request on a committed credential before the five-minute
  # suite has finished starting.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks compares against history; a shallow clone would only ever scan the tip and
          # report clean on a repository with a secret three commits back.
          fetch-depth: 0

      - name: Scan the full history for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Advisories only fail the build at high or critical. Moderate findings in a dev-only
      # dependency should not block a release at 23:00; they should be visible in the log.
      - name: Audit dependencies
        run: pnpm audit --prod --audit-level high

  # The same suite, a year from now.
  #
  # Two tests in `jobs/worker.test.ts` once pinned a clock to `2026-09-22T10:00:00Z` and compared
  # it against a `runAfter` the repository stamps from the wall clock. The real assertion was
  # therefore "the current time is before 10:00 UTC on 2026-09-22": green the morning they were
  # written, red that afternoon, and red for good. `docs/PROGRESS.md` § Phase 1 has the mechanism.
  #
  # A lint rule against date literals was measured first and rejected: a broad one needs a
  # twelve-file allowlist on day one, and a narrow one's only hit — `demo/schedule.test.ts` — is a
  # false positive, because its `now` feeds a pure function with every assertion relative to that
  # same `now`. An allowlist that large is a rubber stamp, and a rubber stamp is the proxy this
  # project keeps mistaking for the thing.
  #
  # Running the suite under a shifted clock has no false positives by construction: it does not
  # guess which literal is dangerous, it just runs the tests in a world where the date has moved.
  # It catches `Date.now()` and a hard-coded literal alike, and it would have caught the original.
  # It needs no Postgres — `database.test.ts` self-skips — but it does need Chromium, because the
  # proof test renders a real PDF and a missing browser would fail it for the wrong reason.
  clock-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime
      # A year, not a day: long enough that any test anchored to "around now" has drifted well
      # past it, short enough to stay inside every certificate and dependency support window.
      #
      # `-f` is required for a relative offset. Without it `faketime` parses the argument as an
      # absolute date and answers "Timestamp to fake not recognized" — which fails the job without
      # running a single test, and would read as "the suite is broken under a shifted clock" to
      # anyone who checked the job's colour rather than its log.
      - name: Run the suite one year ahead
        run: faketime -f '+1y' pnpm run test

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: throwpaper
          POSTGRES_PASSWORD: throwpaper
          POSTGRES_DB: throwpaper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U throwpaper" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://throwpaper:throwpaper@localhost:5432/throwpaper
      # Test value only. Real deployments generate their own; the server refuses to start without one.
      JWT_SECRET: ci-only-secret-at-least-thirty-two-characters
      DOCUMENT_SIGNING_SECRET: ci-only-document-secret-at-least-thirty-two
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The phase 1 proof test renders a real PDF; phase 3 e2e will reuse this browser.
      - run: pnpm exec playwright install --with-deps chromium
      # Migrate before verify: the database smoke test needs the schema to exist, and this is
      # the order a real deployment uses. Seeding here also proves the seed matches the schema.
      - run: pnpm run db:migrate
      - run: pnpm run db:seed
      - run: pnpm run verify
      - run: pnpm run contract:check
      # Loppa is proprietary (docs/adr/0015-reusing-open-source.md): nothing copyleft ships.
      - run: pnpm run licence:check
      # The build `verify` just produced, measured against a budget. Bundles grow one
      # reasonable import at a time; a number that fails here is the only version of this
      # check that works, because a number in a document is a number nobody reads.
      - run: pnpm run bundle:budget
      - run: pnpm run format:check
      # The only place the end-to-end suite can run: it needs the Postgres this job provides.
      - run: pnpm run test:e2e
        env:
          CI: 'true'
      # The Dockerfile is only ever proven by building it, and nobody here has Docker.
      - name: Build the deployment image
        run: docker build -t loppa:ci .

      # A container that boots and answers is the difference between "it compiled" and "it runs".
      - name: Smoke-test the image in demo mode
        run: |
          # Whatever happens, print the container's own account of it. The first version of this
          # step exited before reaching `docker logs`, so a crash-at-boot reported nothing but a
          # column of refused connections.
          trap 'echo "--- container logs ---"; docker logs loppa-demo 2>&1 || true; docker rm -f loppa-demo > /dev/null 2>&1 || true' EXIT

          # The image is NODE_ENV=production, and demo mode refuses that unless it is asked for
          # twice. That guard is the point, so the smoke test opts in rather than weakening it.
          docker run -d --name loppa-demo -p 4100:4001 -e DEMO=true -e DEMO_ALLOW_PRODUCTION=true loppa:ci

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4100/health > /dev/null; then break; fi
            if [ -z "$(docker ps -q -f name=loppa-demo)" ]; then
              echo "The container exited before it ever answered."
              exit 1
            fi
            sleep 2
          done

          curl -fsS http://localhost:4100/health | tee /dev/stderr | grep -q '"mode":"demo"'

          # The app itself must be served, not just the API.
          curl -fsS http://localhost:4100/ | grep -qi '<div id="root"'
          # And a client route must fall back to index.html rather than 404.
          curl -fsS http://localhost:4100/f/varmotet | grep -qi '<div id="root"'

          # The app is built to call /api/*, which only the Vite dev proxy used to strip. Without
          # the server doing it too, the container serves a page that renders and then fails every
          # request — which is worse than not starting, because it looks like it works.
          curl -fsS http://localhost:4100/api/health | grep -q '"mode":"demo"'
          curl -fsS http://localhost:4100/api/public/forms/varmotet | grep -q '"slug":"varmotet"'

          # A JavaScript bundle must come back as JavaScript. If the SPA fallback swallows it, the
          # browser refuses the module on MIME grounds and the page is blank.
          asset=$(curl -fsS http://localhost:4100/ | grep -o '/assets/[A-Za-z0-9_-]*.js' | head -1)
          echo "asset: $asset"
          curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:4100$asset" | grep -q javascript

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
