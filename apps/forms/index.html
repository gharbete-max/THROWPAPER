<!doctype html>
<!--
  `lang` is replaced with the chosen locale as soon as React runs — see `lib/theme.ts`. It starts as
  English rather than Swedish because that is the language of the markup below and the fallback
  everything else resolves to; the hard-coded `sv` it had was announcing a Japanese interface as
  Swedish to every screen reader that read it.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the check-in screen reaches under a phone's notch and home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      A placeholder, replaced at runtime with the organisation's own background colour so the
      phone's status bar matches the page it sits above. It was `#1f4b99` — the blue this product
      shipped with two palettes ago, and hard-coded, so it could not have followed a customer's
      brand even if it had been current.

      It is the page colour and not the brand's, because `syncThemeColour` overwrites it with
      `--tp-colour-background`: anything else here is a flash of the wrong colour before the first
      paint. The brand handoff once asked for the primary in this slot, which is why that is worth stating.
    -->
    <meta name="theme-color" content="#fafaf8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      An SVG favicon, with the PNG as the fallback for browsers that want a bitmap. The tab icon
      was missing entirely before this: every tab showed the browser's default globe, which is the
      one piece of branding a person sees whether or not they ever look at the page.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Loppa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
