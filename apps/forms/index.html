<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the check-in screen reaches under a phone's notch and home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4b99" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!--
      An SVG favicon, with the PNG as the fallback for browsers that want a bitmap. The tab icon
      was missing entirely before this: every tab showed the browser's default globe, which is the
      one piece of branding a person sees whether or not they ever look at the page.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Formwork</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
