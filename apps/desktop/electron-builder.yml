# Loppa for Windows — packaging (docs/adr/0016-desktop-edition.md).
#
# Packs the staging folder `scripts/build.ts` produces, never the workspace: the script runs
# electron-builder with `--projectDir .stage`, so every path below is relative to the stage. Run
# through `pnpm --filter @tp/desktop package:win`; the release workflow does the same on
# windows-latest.
appId: com.throwpaper.loppa
productName: Loppa
copyright: Copyright © Loppa. All rights reserved.
directories:
  app: .
  output: ../release
  buildResources: build
files:
  - main.js
  - preload.cjs
  - package.json
  - node_modules/**
# Plain folders beside the asar: the server streams the web bundle and the migrator reads the SQL at
# every start, and both are simpler and faster as ordinary files.
extraResources:
  - from: web
    to: web
  - from: drizzle
    to: drizzle
  - from: panel
    to: panel
# PGlite reads its WebAssembly with fs from beside its module; out of the asar, nothing can go wrong.
asarUnpack:
  - node_modules/@electric-sql/pglite/**
# No native modules anywhere in the app, so nothing to rebuild against Electron's ABI.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  # Code signing is the owner's certificate (LAUNCH-CHECKLIST §6). Until it exists, SmartScreen
  # warns on first run — the ADR says so rather than hiding it.
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Loppa-Setup-${version}.${ext}
  # Uninstalling keeps %APPDATA%\Loppa — the user's forms and answers are not the program's to delete.
  deleteAppDataOnUninstall: false
portable:
  artifactName: Loppa-${version}-portable.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  artifactName: Loppa-${version}.${ext}
